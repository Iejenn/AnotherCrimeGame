<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Underworld: the city at dusk under a red moon. Full-bleed background; the skyline and moon stay inside the
       middle 80% so the icon also works as a "maskable" (round or squircle) icon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="0.62" stop-color="#3a2230"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#d9473a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d9473a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="218" r="150" fill="url(#glow)"/>
  <circle cx="256" cy="218" r="104" fill="#d9473a"/>
  <circle cx="226" cy="190" r="16" fill="#c23d31"/>
  <circle cx="290" cy="242" r="11" fill="#c23d31"/>
  <!-- the skyline -->
  <g fill="#0f0e0c">
    <rect x="62" y="262" width="70" height="250"/>
    <rect x="124" y="214" width="62" height="298"/>
    <rect x="178" y="292" width="52" height="220"/>
    <rect x="224" y="244" width="70" height="268"/>
    <rect x="236" y="214" width="10" height="34"/>
    <rect x="288" y="280" width="56" height="232"/>
    <rect x="336" y="196" width="66" height="316"/>
    <rect x="396" y="270" width="56" height="242"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffc46b">
    <rect x="78" y="284" width="12" height="16"/><rect x="104" y="284" width="12" height="16"/><rect x="78" y="324" width="12" height="16"/>
    <rect x="140" y="238" width="12" height="16"/><rect x="164" y="278" width="12" height="16"/><rect x="140" y="318" width="12" height="16"/>
    <rect x="190" y="312" width="10" height="14"/><rect x="210" y="350" width="10" height="14"/>
    <rect x="240" y="268" width="12" height="16"/><rect x="268" y="268" width="12" height="16"/><rect x="268" y="308" width="12" height="16"/><rect x="240" y="348" width="12" height="16"/>
    <rect x="300" y="302" width="10" height="14"/><rect x="322" y="340" width="10" height="14"/>
    <rect x="350" y="220" width="12" height="16"/><rect x="376" y="260" width="12" height="16"/><rect x="350" y="300" width="12" height="16"/><rect x="376" y="340" width="12" height="16"/>
    <rect x="410" y="294" width="10" height="14"/><rect x="430" y="332" width="10" height="14"/>
  </g>
  <!-- the street -->
  <rect x="0" y="420" width="512" height="92" fill="#141210"/>
  <rect x="0" y="420" width="512" height="6" fill="#d9473a" opacity="0.8"/>
</svg>
